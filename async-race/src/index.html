<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async-Race</title>
    <link rel="icon" href="./vendor/favicon.png" />
  </head>
  <body class="root">
    <main class="main">
      <div class="control">
        <form class="control__edit">
          <input type="text" class="control__input" />
          <input type="color" class="control__input" />
          <button class="btn">create</button>
        </form>
        <div class="control__btns">
          <button class="btn control__race-btn">race</button>
          <button class="btn control__reset-btn">reset</button>
          <button class="btn control__generate-btn">generate cars</button>
        </div>
      </div>
      <div class="section">
        <h2 class="section__title">
          Garage(<span class="section__items-qty">104</span>)
        </h2>
        <div class="section__row">
          <p class="section__page">
            Page <span class="section__page-num">1</span> of
            <span class="section__page-qty">1</span>
          </p>
          <div class="section__pagination">
            <button class="btn section__prev-btn">prev</button>
            <button class="btn section__next-btn">next</button>
          </div>
        </div>
        <div class="section__content"></div>
      </div>
    </main>
    <template id="carTemplate">
      <div class="car">
        <div class="car__heading">
          <button class="btn car__edit-btn">edit</button>
          <button class="btn car__remove-btn">remove</button>
          <h3 class="car__title">Tesla model s</h3>
        </div>
        <div class="car__main">
          <div class="car__nav">
            <button class="car__btn car__start-btn">A</button>
            <button class="car__btn car__stop-btn">B</button>
          </div>
          <div class="car__track">
            <div class="car__car"></div>
            <img
              src="./assets/img/flag_finish_fill.svg"
              alt="finish flag"
              class="car__finish-flag"
            />
          </div>
        </div>
      </div>
    </template>
    <template id="winnerTemplate">
      <div class="winner">
        <p class="winner__text winner__text_type_number"></p>
        <!-- <img src="#" alt="car icon" class="winner__icon" /> -->
        <p class="winner__text winner__text_type_name"></p>
        <p class="winner__text winner__text_type_wins"></p>
        <p class="winner__text winner__text_type_best-time"></p>
      </div>
    </template>
  </body>
</html>
