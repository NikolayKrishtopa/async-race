<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async-Race</title>
    <link rel="icon" href="./vendor/favicon.png" />
  </head>
  <body class="root">
    <header class="header">
      <h1 class="header__title">ASYNC RACE</h1>
      <div class="header__btn-wrapper">
        <button class="header__link" id="garageBtn">Garage</button>
        <button class="header__link" id="winnersBtn">Winners</button>
      </div>
    </header>
    <main class="main">
      <div class="control">
        <form class="control__edit">
          <input type="text" class="control__input" />
          <input type="color" class="control__input" />
          <button class="btn">create</button>
        </form>
        <div class="control__btns">
          <button class="btn control__race-btn">race</button>
          <button class="btn control__reset-btn">reset</button>
          <button class="btn control__generate-btn">generate cars</button>
        </div>
      </div>
      <div class="section">
        <h2 class="section__title">Garage(104)</h2>
        <p class="section__page-number">Page 1 of 4</p>
        <div class="section__content">
          <div class="car">
            <div class="car__heading">
              <button class="btn">edit</button>
              <button class="btn">remove</button>
              <h3 class="car__title">Tesla model s</h3>
            </div>
            <div class="car__main">
              <div class="car__nav">
                <button class="car__btn car__btn_type_start">A</button>
                <button class="car__btn car__btn_type_stop">B</button>
              </div>
              <div class="car__track">
                <div class="car__car"></div>
                <img
                  src="./assets/img/flag_finish_fill.svg"
                  alt="finish flag"
                  class="car__finish-flag"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
